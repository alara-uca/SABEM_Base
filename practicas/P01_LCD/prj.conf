# Módulos de la asignatura que usa el programa (carpeta modulos/).
#
# Cada módulo se activa con una línea CONFIG_MCUX_COMPONENT_<NOMBRE>=y. Los drivers del SDK que
# necesita cada módulo los activa él solo: aquí no hace falta ponerlos.
#
# Reglas de este fichero:
#  - Una opción por línea.
#  - Los comentarios van en su propia línea, nunca al final de una opción.
#  - Después de cambiarlo: en VS Code, «CMake: Delete Cache and Reconfigure», y compilar.
#
# Guía completa: Plantillas/PLANTILLA_MODULO.md del repositorio de la asignatura.

