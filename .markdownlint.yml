# Markdownlint configuration file

no-inline-html:
  allowed_elements:
    - a
    - img
    - code
    - p
    - br
    - strong
    - em

line-length:
  severity: warning
  line_length: 100
  headings: true
  heading_line_length: 100
  code_blocks: true
  code_block_line_length: 100
  tables: false
  strict: false
  stern: true

ul-indent:
  indent: 4

code-block-style:
  style: consistent

table-column-style:
  # Table column style
  style: any
  # Aligned delimiter columns
  aligned_delimiter: false

no-hard-tabs:
  # Include code blocks
  code_blocks: true
  # Fenced code languages to ignore
  ignore_code_languages: []
  # Number of spaces for each hard tab
  spaces_per_tab: 2

no-duplicate-heading:
  siblings_only: true
